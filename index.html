<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wisdom Button</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .screen {
      width: 100%;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .subtitle {
      opacity: 0.7;
      margin-bottom: 40px;
    }

    button {
      padding: 20px 40px;
      font-size: 1.2rem;
      border: none;
      border-radius: 12px;
      background: #1e90ff;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(30,144,255,0.4);
    }

    button:active {
      transform: scale(0.98);
    }

    #adviceText {
      font-size: 1.5rem;
      padding: 20px;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body>

<div id="home" class="screen">
  <h1>Wisdom Button</h1>
  <p class="subtitle">Tap for clarity</p>
  <button onclick="showAdvice()">WISDOM</button>
</div>

<div id="advice" class="screen" style="display:none;">
  <p id="adviceText"></p>
</div>

<script>
  const adviceList = [
    "Discipline beats motivation.",
    "You already know what to do.",
    "Small steps still move you forward.",
    "Stop waiting for perfect timing.",
    "Your habits shape your future.",
    "Focus on what you can control.",
    "Overthinking delays progress.",
    "Consistency builds confidence.",
    "Do it even if it’s not perfect.",
    "Progress is better than comfort.",
    "You don’t need more time, just action.",
    "What you avoid controls you.",
    "Stay patient with your growth.",
    "Your mindset creates your reality.",
    "Less talk, more action.",
    "You are closer than you think.",
    "Fear fades when action begins.",
    "One decision can change everything.",
    "Stay simple, stay focused.",
    "Energy follows attention.",
    "You can restart at any moment.",
    "Discomfort means growth is happening.",
    "Stop doubting what you already know.",
    "Your future self is watching you.",
    "Do it scared, but do it."
  ];

  const home = document.getElementById("home");
  const advice = document.getElementById("advice");
  const adviceText = document.getElementById("adviceText");

  let timer;

  function showAdvice() {
    const random = Math.floor(Math.random() * adviceList.length);
    adviceText.textContent = adviceList[random];

    home.style.display = "none";
    advice.style.display = "block";

    clearTimeout(timer);
    timer = setTimeout(resetApp, 4000);
  }

  function resetApp() {
    advice.style.display = "none";
    home.style.display = "block";
  }
</script>

</body>
</html>
